# Kernel-side package for the bundled apply-patch skill. It writes every
# update hunk through the bundled `edit` skill, which the kernel always
# installs alongside it; `edit` is not published on PyPI, so it is
# intentionally not declared as a dependency.
[project]
name = "apply-patch"
version = "0.1.0"
description = "Prime Agent apply-patch skill: OpenAI V4A patches, validated whole, applied through edit"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apply_patch"]
